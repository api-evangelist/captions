aid: captions
name: Captions
description: 'Captions is an AI video editor and generator built by Mirage, an AI research company headquartered
  in New York City. The consumer and enterprise apps automate the most time-consuming parts of video production
  — cutting scenes, adding B-roll, inserting music and sound effects, generating and styling captions,
  dubbing into 30+ languages, correcting eye contact, and generating entirely new videos from a text prompt
  or a selfie via AI Avatars, AI Actors, and AI Twins. The Mirage Video API (api.mirage.app) exposes this
  pipeline to developers: asynchronous AI video generation, adding stylized captions to videos, caption-template
  discovery, text-to-speech audio, and meta text overlays. Authentication is a simple x-api-key header,
  keys are minted in the Mirage platform dashboard, and long-running jobs are polled for status.'
